services:
  text-to-bpmn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text-to-bpmn
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DOCKER_CONTAINER=true
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://host.docker.internal:8000/v1}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./server.js:/app/server.js
      - ./system_prompt.txt:/app/system_prompt.txt
      - ./system_prompt_camunda.txt:/app/system_prompt_camunda.txt
      - ./public:/app/public
      - ./scripts:/app/scripts
    mem_limit: 512m
    cpus: '2'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 3000) + '/api/active-model').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
